name: Email notification queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email processor
        run: |
          curl -sS -X POST "${{ secrets.PROD_URL }}/api/process-email-notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -w "\nHTTP %{http_code}\n"
